<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suno Studio</title>
<style>
:root{--bg:#0d0a18;--c:#1a162b;--c2:#120f20;--b:#2e2750;--t:#e8e6f5;--m:#9a94b8;--a:#8b5cf6;--a2:#ec4899;--w:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,'Segoe UI',Tahoma,sans-serif;color:var(--t);min-height:100vh;background:radial-gradient(circle at 10% 0,#2a1556 0,transparent 35%),radial-gradient(circle at 90% 100%,#3d1033 0,transparent 35%),var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:9;background:#0d0a18ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 18px}
.logo{font-weight:800;font-size:19px;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bpm{display:flex;align-items:center;gap:8px;flex:1;min-width:250px;max-width:440px;font-size:14px}
.bpm input[type=range]{flex:1;accent-color:var(--a)}
input[type=text],select,textarea{background:var(--c2);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:0;border-color:var(--a);box-shadow:0 0 0 2px #8b5cf655}
button,label.btn{font:inherit;cursor:pointer}
.btn{background:var(--c2);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;transition:.15s;display:inline-block}
.btn:hover{border-color:var(--a);background:#241d42}
.pri{background:linear-gradient(90deg,var(--a),#6d28d9);border-color:transparent}
.dng{color:#fca5a5}
nav{display:flex;gap:4px;padding:12px 18px 0;max-width:1400px;margin:auto;flex-wrap:wrap}
nav button{background:none;color:var(--m);border:0;border-bottom:3px solid transparent;padding:10px 18px;font-weight:700;font-size:15px}
nav button.on{color:#fff;border-color:var(--a2)}
main{max-width:1400px;margin:auto;padding:14px 18px 40px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px}
.out{margin-bottom:16px}
.out textarea{width:100%;min-height:150px;resize:vertical;font-family:Consolas,'JetBrains Mono',monospace;font-size:15px;line-height:1.7;direction:ltr;text-align:left;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.pn h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between}
.pn h3 small{color:var(--a2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow:auto;padding:2px}
.chip{background:var(--c2);color:var(--t);border:1px solid var(--b);border-radius:999px;padding:5px 12px;font-size:13px;transition:.12s}
.chip:hover{border-color:var(--a)}
.chip.on{background:linear-gradient(90deg,var(--a),var(--a2));border-color:transparent;color:#fff;box-shadow:0 0 12px #8b5cf655}
.cnt{font-size:12px;color:var(--m)}.cnt.bad{color:#f87171;font-weight:700}
.warn{color:var(--w);font-size:13px}
.lay{display:grid;grid-template-columns:1fr 390px;gap:14px;align-items:start}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px);overflow:auto}
.side .chips{max-height:150px}
.side h3{margin:0 0 8px;font-size:14px}
#ed{width:100%;min-height:540px;resize:vertical;line-height:1.9;font-size:16px;margin:10px 0}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ex textarea{width:100%;min-height:340px;margin-top:10px;line-height:1.7}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--c);border:1px solid var(--a);padding:10px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:20}
#toast.on{transform:translate(-50%,0);opacity:1}
.mi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.mi a{color:#a78bfa}
@media(max-width:900px){.lay,.ex{grid-template-columns:1fr}.side{position:static;max-height:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<span class="logo">Suno Studio</span>
<input type="text" id="ti" data-p="ph" oninput="rd()">
<div class="bpm"><input type="checkbox" id="ub" onchange="rd()" title="BPM"><input type="range" id="bp" min="50" max="200" oninput="rd()"><b><span id="bv"></span> BPM</b></div>
<select id="ver" onchange="rd()"><option value="0">v3.5 / v4 (200 · 3000)</option><option value="1">v4.5+ (1000 · 5000)</option></select>
<button class="btn" onclick="setKey()">🔑 Gemini</button><button class="btn" id="lgb" onclick="lg()"></button>
</header>
<nav>
<button data-g="st" data-t="t1" onclick="go('st')"></button>
<button data-g="ly" data-t="t2" onclick="go('ly')"></button>
<button data-g="ex" data-t="t3" onclick="go('ex')"></button>
<button data-g="mi" data-t="t4" onclick="go('mi')"></button>
</nav>
<main>
<section class="tab on" id="t-st">
<div class="card out">
<div class="row"><b data-t="o1"></b><span class="sp"></span><span class="cnt" id="sc"></span><button class="btn pri" onclick="cp('so')" data-t="cps"></button><button class="btn pri" onclick="ai()" data-t="ai"></button><button class="btn" onclick="sug()" data-t="sg"></button><button class="btn dng" onclick="clS()" data-t="clr"></button></div>
<textarea id="so" readonly></textarea>
<div class="row"><input type="text" id="ex" class="sp" data-p="exp" oninput="rd()"><button class="btn" onclick="cp('ex')" data-t="cpx"></button></div>
<div class="warn" id="wr" style="margin-top:8px"></div>
</div>
<div class="grid" id="pg"></div>
</section>

<section class="tab" id="t-ly">
<div class="lay">
<div class="card">
<div class="row"><b data-t="edt"></b><span class="sp"></span><span class="cnt" id="ls"></span></div>
<textarea id="ed" dir="auto" data-p="edp" oninput="u2()"></textarea>
<p class="cnt" data-t="hint" style="margin:0 0 8px"></p>
<div class="row"><button class="btn pri" onclick="gen()" data-t="gn"></button><button class="btn pri" onclick="ai()" data-t="ai"></button><button class="btn pri" onclick="auto()" data-t="aut"></button><button class="btn" onclick="sug()" data-t="sg"></button><label class="cnt"><input type="checkbox" id="io" checked> <span data-t="io"></span></label><button class="btn" onclick="cp('ed')" data-t="cpl"></button><button class="btn dng" onclick="clL()" data-t="cll"></button><span class="sp"></span><span class="cnt" id="du"></span></div>
</div>
<div class="side">
<div class="card"><h3 data-t="tpl"></h3><div class="chips" id="ct"></div></div>
<div class="card"><h3 data-t="str"></h3><div class="chips" id="cs"></div></div>
<div class="card"><h3 data-t="prf"></h3><div class="chips" id="cv"></div></div>
<div class="card"><h3 data-t="sol"></h3><div class="chips" id="ci"></div></div>
<div class="card"><h3 data-t="fx"></h3><div class="chips" id="cf"></div></div>
</div>
</div>
</section>

<section class="tab" id="t-ex">
<div class="ex">
<div class="card"><div class="row"><b data-t="sty"></b><span class="sp"></span><button class="btn pri" onclick="cp('xs')" data-t="cps"></button></div><textarea id="xs" readonly dir="ltr"></textarea></div>
<div class="card"><div class="row"><b data-t="lyr"></b><span class="sp"></span><button class="btn pri" onclick="cp('xl')" data-t="cpl"></button></div><textarea id="xl" readonly dir="auto"></textarea></div>
</div>
<div class="row" style="margin-top:14px"><button class="btn" onclick="exTxt()" data-t="dlt"></button><button class="btn" onclick="exJ()" data-t="dlj"></button><label class="btn" for="jf" data-t="ldj"></label><input type="file" id="jf" accept=".json" hidden onchange="ldJ(this)"></div>
</section>

<section class="tab" id="t-mi">
<div class="card"><p class="cnt" data-t="mid"></p><label class="btn pri" for="mf" data-t="mia"></label><input type="file" id="mf" accept=".mid,.midi" hidden onchange="mAdd(this)"><div id="ml" style="margin-top:12px"></div></div>
</section>
</main>
<div id="toast"></div>

<script>
const $=i=>document.getElementById(i),L=s=>s.split(';').map(x=>x.split('|'));
const T={
ph:['اسم المشروع','Project name'],t1:['الستايل','Style'],t2:['الكلمات والهيكل','Lyrics & structure'],t3:['المعاينة والتصدير','Preview & export'],t4:['مكتبة MIDI','MIDI library'],
o1:['مخرج الستايل (الصقه في خانة Style)','Style output (paste into Style box)'],cps:['نسخ الستايل','Copy style'],clr:['مسح الاختيارات','Clear selection'],
exp:['استبعاد (Exclude): مثال no autotune, no rap','Exclude: e.g. no autotune, no rap'],cpx:['نسخ الاستبعاد','Copy exclude'],cuph:['وسم مخصص','Custom tag'],
tpl:['قوالب هيكل جاهزة','Structure templates'],str:['فصول الأغنية','Sections'],prf:['أداء الفصل الحالي (ضع المؤشر داخله)','Assign to current section (cursor inside)'],sol:['صولو وآلات','Solos & instruments'],fx:['مؤثرات وانتقالات','FX & transitions'],
